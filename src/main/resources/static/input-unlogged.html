<html>
<head>
    <title>Generator Peseli</title>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css"
          integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <h1>Pesel Generator</h1>

    <form method="get" th:action="@{/result}">

        <div class="form-div">
            <label>Data urodzenia
                <input name="birthDate" type="date" required>
            </label>
        </div>

        <div class="form-div">
            <label>Płeć</label>
            <label><input name="plec" type="radio" value="M" required> M</label>
            <label><input name="plec" type="radio" value="K" required> K</label>
        </div>

        <div class="button-menu">
            <button class="btn btn-primary" type="submit">Generuj</button>
        </div>

        <div class="login-prompt">
            <p>Tylko dla zalogowanych użytkowników dostępne są funckje Premium:</p>
            <ul>
                <li>generowanie wielu peseli na raz,</li>
                <li>pobranie wyniku w formacie plain,</li>
                <li>wysyłanie wyniku na maila.</li>
            </ul>
        </div>

        <div class="button-menu">
            <a class="btn btn-primary" th:href="@{/login}">Zaloguj się</a>
            <a th:href="@{/register}" class="btn btn-primary">Zajerestruj się</a>
        </div>
    </form>
</div>
</body>
</html>
