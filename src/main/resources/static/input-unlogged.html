<html>
<head>
    <title>Generator Peseli</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
    <link rel="stylesheet" href="css/input.css">
</head>
<body>
    <div class="options">
        <h1>Pesel Generator</h1>
        <form th:action="@{/result}" method="get">

            <div class="form-div">
            <label>Data urodzenia
                <input type="date"></label>
            </div>
            <div class="form-div">
            <label>Płeć
                <label><input type="radio" name="plec" value="M"> M</label>
                <label><input type="radio" name="plec" value="K"> K</label></label>
            </div>

            <button type="submit" class="btn btn-primary">Generuj</button>

            <div class="login-prompt">
                <p>Tylko dla zalogowanych użytkowników dostępne są funckje Premium:</p>
                <ul>
                    <li>generowanie wielu peseli na raz,</li>
                    <li>pobranie wyniku w formacie plain,</li>
                    <li>wysyłanie wyniku na maila.</li>
                </ul>
            </div>

            <a th:href="@{/login}" class="btn btn-primary">Zaloguj się</a>
        </form>
    </div>
</body>
</html>
