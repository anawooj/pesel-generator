<html>
<head>
    <title>Generator Peseli</title>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css"
          integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Pesel Generator</h1>

        <p>Twoje wygenerowane pesele:</p>
        <div class="pesel-list">
            <p th:each="p : ${pesels}" th:text="${p}"></p>
        </div>

        <div class="button-menu">
            <a class="btn btn-primary" th:href="@{/send-mail}">Wyślij wynik na maila</a>
            <form method="post" th:action="@{/download}">
                <button class="btn btn-primary" type="submit">Pobierz jako .txt</button>
            </form>

            <button class="btn btn-primary" onClick="window.location.reload();">Generuj ponownie</button>
            <a class="btn btn-primary" th:href="@{/}">Zmień parametry</a>
        </div>
    </div>
</body>
</html>
